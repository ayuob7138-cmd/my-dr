<style>

#tg{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:3}#tg button{font-size:13px;padding:4px 12px;background:var(--bg1)}
</style>

<script>
var S=[
["My beautiful doctor ❤️",1],
["There is something I want you to know, something I probably don’t tell you enough: I am so incredibly proud of you, more than you could ever imagine."],
["I am proud of every step you take, even the little ones that nobody notices but you."],
["I see someone truly extraordinary in you. Not just your beauty, but your mind, your heart, your ambition, and the beautiful soul behind it all."],

var L=["Ahem! A very important letter is about to begin!","Proud of her? Obviously! Who wouldn’t be?!","Even tiny steps count. Tiny like these spiders!","Extraordinary! I said it before you did!","Studying is hard. Have some lemonade.","You’ve come far. Very, VERY far!","A dream deserves effort. And snacks.","A white coat! Please keep it spotless!","Smile, laugh, overthink… all excellent!","He believes in you. So do I. So do the spiders.","Cry, rest, retry. Rules of the lemon!","Say it loud: I DID IT!","Love beats exams. Mostly.","A future doctor! Make way!","Congratulations in advance, Doctor! 🍋"],bub=document.getElementById('bub');
L=["أحم! رسالة مهمة جداً على وشك أن تبدأ!","فخور بها؟ طبعاً! ومن لا يكون؟!","حتى الخطوات الصغيرة تُحسب. صغيرة مثل هذه العناكب!","استثنائية! قلتها قبلك!","الدراسة صعبة. تفضّلي بعض عصير الليمون.","لقد قطعتِ مسافة طويلة. طويلة جداً جداً!","الحلم يستحق الجهد. والوجبات الخفيفة.","معطف أبيض! أرجو أن تحافظي على نظافته!","ابتسامة وضحكة وتفكير زائد… كلها رائعة!","هو يؤمن بكِ. وأنا كذلك. والعناكب أيضاً.","ابكي، استريحي، حاولي من جديد. قوانين الليمون!","قوليها بصوت عالٍ: لقد فعلتها!","الحب يغلب الامتحانات. تقريباً.","طبيبة المستقبل! أفسحوا الطريق!","مبروك مقدماً يا دكتورة! 🍋"];bub.dir='rtl';
var SA=["طبيبتي الجميلة ❤️","هناك شيء أريدكِ أن تعرفيه، شيء ربما لا أقوله لكِ كثيراً: أنا فخور بكِ جداً، أكثر مما تتخيلين.","أنا فخور بكل خطوة تخطينها، حتى الصغيرة منها التي لا يلاحظها أحد غيركِ.","أرى فيكِ إنسانة استثنائية حقاً. ليس لجمالكِ فقط، بل لعقلكِ وقلبكِ وطموحكِ والروح الجميلة التي تقف خلف كل ذلك.","أعلم أن الدراسة ليست سهلة. هناك أيام يبدو فيها كل شيء ثقيلاً، وتجعلكِ الامتحانات تتساءلين إن كنتِ ستتمكنين من كل ذلك.","لكن أرجوكِ، لا تدعي لحظة صعبة تجعلكِ تشكّين في قدراتكِ، ولا تدعي الخوف من طول الطريق ينسيكِ كم قطعتِ منه.","أنتِ لا تدرسين لتنجحي في امتحان فقط. أنتِ تبنين مستقبلكِ، وتقتربين كل يوم من حلم يستحق كل جهدكِ.","وفي يوم ما سترتدين ذلك المعطف الأبيض، وسيناديكِ الناس دكتورة، وستدركين أن شيئاً من ذلك لم يذهب سدى.","شكراً لوجودكِ، ولطفكِ، ولطريقتكِ في الكلام. ابتسامتكِ وضحكتكِ وعفويتكِ، وحتى قلقكِ وتفكيركِ الزائد. جمالكِ يتجاوز المظهر بكثير.","أنا هنا لأذكّركِ بقوتكِ حين تصعب الأمور، ولأؤمن بكِ حتى حين تجدين صعوبة في الإيمان بنفسكِ.","كوني إنسانة. تعبي، استريحي، ابكي إن احتجتِ، ثم حاولي من جديد. فقط لا تتخلي عن حلمكِ.","أتمنى أن يأتي اليوم الذي أراكِ فيه بابتسامتكِ الجميلة وأنتِ تقولين: «لقد فعلتها!»","أحب جمالكِ، لكني أحب أكثر الإنسانة التي خلفه. أُعجب بطموحكِ، وأحترم ذكاءكِ، وأشعر بالامتنان لوجودكِ في حياتي.","قد ترين نفسكِ طالبة تلهث خلف الدروس، لكني أرى طبيبة المستقبل في طريقها لتصبح كل ما حلمت به.","أحبكِ، وأسأل الله أن يعوّض كل تعبكِ بسعادة تفوق ما تتخيلين. ❤️"];
var lang='en',ac,mon=false,mt,pi=0,ni=0,P=[[261.6,329.6,392],[220,261.6,329.6],[174.6,220,261.6],[196,246.9,392]];
function txt(n){return lang==='ar'?SA[n]:S[n][0]}
document.getElementById('lg').onclick=function(){lang=lang==='ar'?'en':'ar';this.textContent=lang==='ar'?'English':'عربي';if(i>=0&&i<S.length){tx.textContent=txt(i);tx.dir=lang==='ar'?'rtl':'ltr'}};
var bus;
function setup(){var c=ac.createConvolver(),len=Math.floor(ac.sampleRate*1.8),b=ac.createBuffer(2,len,ac.sampleRate);for(var ch=0;ch<2;ch++){var d=b.getChannelData(ch);for(var k=0;k<len;k++)d[k]=(Math.random()*2-1)*Math.pow(1-k/len,2.5)}c.buffer=b;bus=ac.createGain();bus.gain.value=.9;var w=ac.createGain();w.gain.value=.55,lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;bus.connect(lp);lp.connect(ac.destination);lp.connect(w);w.connect(c);c.connect(ac.destination)}
function note(f,d,v,n){var g=ac.createGain();g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+.02);g.gain.exponentialRampToValueAtTime(.0001,n+d);g.connect(bus);[[1,1],[2,.2]].forEach(function(p){var o=ac.createOscillator(),h=ac.createGain();o.frequency.value=f*p[0];h.gain.value=p[1];o.connect(h);h.connect(g);o.start(n);o.stop(n+d+.1)})}
function pad(f,d,n){var g=ac.createGain();g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(.035,n+2);g.gain.linearRampToValueAtTime(0,n+d);g.connect(bus);[-4,4].forEach(function(dt){var o=ac.createOscillator();o.type='sine';o.frequency.value=f;o.detune.value=dt;o.connect(g);o.start(n);o.stop(n+d)})}
var CH=[{b:110,t:[220,261.63,329.63,440],m:[659.25,523.25,440]},{b:87.31,t:[174.61,220,261.63,349.23],m:[698.46,523.25,440]},{b:130.81,t:[261.63,329.63,392,523.25],m:[783.99,659.25,523.25]},{b:98,t:[196,246.94,293.66,392],m:[587.33,493.88,783.99]}],step=0;

function mtog(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(!bus)setup();mon=!mon;if(mon){ac.resume();nt=ac.currentTime+.15;mus()}else clearTimeout(mt);document.getElementById('mu').textContent='♪ Music: '+(mon?'on':'off')}catch(e){}}

var i=-1,t=null,paused=true,started=false,tx=document.getElementById('text'),bar=document.getElementById('bar'),hint=document.getElementById('hint'),stage=document.getElementById('stage');
function heart(){var e=document.createElement('div');e.className='h';e.textContent='♥';e.style.left=Math.random()*100+'%';e.style.fontSize=(12+Math.random()*22)+'px';e.style.animationDuration=(7+Math.random()*6)+'s';document.body.appendChild(e);setTimeout(function(){e.remove()},13000)}
